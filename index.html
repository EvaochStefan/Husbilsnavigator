<!DOCTYPE html>

<html>

<head>

  <title>Vår Husbilsnavigator</title>

</head>
 
<body>

  <h1>Vår Husbilsnavigator</h1>

  <p>Dethleffs: 8,5 m lång, 3,20 m hög, 2,40 m bred, 4 250 kg.</p>

  <h2>Karta</h2>

<iframe

  width="100%"

  height="450"

  style="border:0"

  src="https://www.openstreetmap.org/export/embed.html?bbox=10.5%2C54.5%2C18.5%2C59.5&amp;layer=mapnik">

</iframe>
<p><strong>⚠️ Husbil:</strong> 8,5 m lång · 3,20 m hög · 2,40 m bred · 4 250 kg. Google Maps tar inte automatiskt hänsyn till dessa mått.</p>

  <h2>Planera resan</h2>

<label for="start">Start:</label><br>

<input type="text" id="start" placeholder="Till exempel Kiel"><br><br>

<label for="destination">Destination:</label><br>

<input type="text" id="destination" placeholder="Till exempel Andorra"><br><br>

<button onclick="planeraRutt()">Planera rutt</button>
<script>


async function planeraRutt() {
  

  const start = document.getElementById("start").value;

  const destination = document.getElementById("destination").value;

  if (!start || !destination) {

    alert("Fyll i både start och destination.");

    return;

  }

  try {

    const response = await fetch(

      "https://broken-tree-6c60.evaharaldsson54.workers.dev/",

      {

        method: "POST",

        headers: {

          "Content-Type": "application/json"

        },

        body: JSON.stringify({

          start: start,

          destination: destination

        })

      }

    );

    const data = await response.json();

    if (!response.ok) {

      throw new Error(data.error || "Rutten kunde inte beräknas.");

    }

    const summary = data.features[0].properties.summary;

    const km = Math.round(summary.distance / 1000);

    const timmar = Math.floor(summary.duration / 3600);

    const minuter = Math.round((summary.duration % 3600) / 60);

    alert(

      "Husbilsrutten fungerar!\\n\\n" +

      "Avstånd: " + km + " km\\n" +

      "Beräknad körtid: " + timmar + " tim " + minuter + " min"

    );

  } catch (error) {

    alert("Något gick fel: " + error.message);

  }

}




</script>
<br><br>
</body>
</html>
