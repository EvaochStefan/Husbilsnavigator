<!DOCTYPE html>

<html>

<head>

  <title>Vår Husbilsnavigator</title>

</head>
 
<body>

  <h1>Vår Husbilsnavigator</h1>

  <p>Dethleffs: 8,5 m lång, 3,20 m hög, 2,40 m bred, 4 250 kg.</p>

  <h2>Karta</h2>

<iframe

  width="100%"

  height="450"

  style="border:0"

  src="https://www.openstreetmap.org/export/embed.html?bbox=10.5%2C54.5%2C18.5%2C59.5&amp;layer=mapnik">

</iframe>
</body>
<h2>Planera resan</h2>

<label for="start">Start:</label><br>

<input type="text" id="start" placeholder="Till exempel Kiel"><br><br>

<label for="destination">Destination:</label><br>

<input type="text" id="destination" placeholder="Till exempel Andorra"><br><br>

<button>Planera rutt</button>
<script>
<p><strong>⚠️ Husbil:</strong> 8,5 m lång · 3,20 m hög · 2,40 m bred · 4 250 kg. Kontrollera alltid höjd-, vikt- och vägbegränsningar.</p>
document.querySelector("button").onclick = function() {

  const start = document.getElementById("start").value;

  const destination = document.getElementById("destination").value;

  window.open("https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(start) + "&destination=" + encodeURIComponent(destination), "_blank");

};

</script>
<br><br>
</html>
